openapi: 3.1.0
info:
  title: EkamCore Local API
  version: 0.1.0-sprint0
  summary: Sprint 0 stub contract for the EkamCore local manager, web, and mobile clients.
  description: >
    Canonical OpenAPI source of truth for the first EkamCore backend slice.
    This Sprint 0 contract intentionally focuses on health, versioning, Today,
    Recap, and job-status stubs with explicit workspace scoping where product
    data is involved.
servers:
  - url: http://127.0.0.1:8808
    description: Local reference-host API endpoint
security: []
tags:
  - name: System
    description: Global runtime and application metadata
  - name: Workspace Summary
    description: Workspace-scoped Today and Recap surfaces
  - name: Jobs
    description: Workspace-scoped job polling
paths:
  /v1/health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Get the local runtime health summary
      responses:
        "200":
          description: Contract-shaped health payload for manager app and local clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                default:
                  value:
                    meta:
                      requestId: d4972f72-2d81-4be8-9f8d-f2269bf9f48e
                      generatedAt: "2026-03-15T14:30:00Z"
                      stub: true
                    data:
                      status: ok
                      summary: Runtime substrate is reachable and the backend stub is ready.
                      checks:
                        - name: docker_desktop_context
                          status: ok
                          detail: Docker Desktop context desktop-linux responded successfully.
                        - name: backend_stub_routes
                          status: ok
                          detail: Health, version, Today, Recap, and job-status stubs are available.
  /v1/version:
    get:
      tags:
        - System
      operationId: getVersion
      summary: Get backend and contract version information
      responses:
        "200":
          description: Version metadata for diagnostics and support workflows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /v1/workspaces/{workspaceId}/today:
    get:
      tags:
        - Workspace Summary
      operationId: getToday
      summary: Get the Today stub payload for a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Today stub payload shaped for client integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"
  /v1/workspaces/{workspaceId}/recap:
    get:
      tags:
        - Workspace Summary
      operationId: getRecap
      summary: Get the Recap stub payload for a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Recap stub payload shaped for client integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapResponse"
  /v1/workspaces/{workspaceId}/jobs/{jobId}:
    get:
      tags:
        - Jobs
      operationId: getJobStatus
      summary: Poll the status of a workspace-scoped background job
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status payload for client polling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          description: Job identifier is not available in the Sprint 0 stub set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Explicit workspace scope for workspace-bound routes
      schema:
        type: string
        minLength: 1
      example: personal
    JobId:
      name: jobId
      in: path
      required: true
      description: Stable job identifier used for polling
      schema:
        type: string
        minLength: 1
      example: initial-bootstrap
  schemas:
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - generatedAt
        - stub
      properties:
        requestId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        stub:
          type: boolean
        workspaceId:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        suggestion:
          type: string
    ProblemResponse:
      type: object
      additionalProperties: false
      required:
        - meta
        - error
      properties:
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        error:
          $ref: "#/components/schemas/Problem"
    HealthCheck:
      type: object
      additionalProperties: false
      required:
        - name
        - status
        - detail
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - ok
            - warning
            - planned
        detail:
          type: string
    HealthData:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - warning
        summary:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - meta
        - data
      properties:
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        data:
          $ref: "#/components/schemas/HealthData"
    VersionData:
      type: object
      additionalProperties: false
      required:
        - applicationVersion
        - apiVersion
        - contractVersion
        - buildChannel
      properties:
        applicationVersion:
          type: string
        apiVersion:
          type: string
        contractVersion:
          type: string
        buildChannel:
          type: string
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - meta
        - data
      properties:
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        data:
          $ref: "#/components/schemas/VersionData"
    AgendaItem:
      type: object
      additionalProperties: false
      required:
        - title
        - startsAt
        - source
      properties:
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        source:
          type: string
    AgendaCard:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - title
        - items
      properties:
        id:
          type: string
        type:
          type: string
          const: agenda
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgendaItem"
    FocusCard:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - title
        - detail
        - actionLabel
      properties:
        id:
          type: string
        type:
          type: string
          const: focus
        title:
          type: string
        detail:
          type: string
        actionLabel:
          type: string
    SystemCard:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - title
        - detail
        - status
      properties:
        id:
          type: string
        type:
          type: string
          const: system
        title:
          type: string
        detail:
          type: string
        status:
          type: string
          enum:
            - planned
            - warming
            - healthy
            - warning
    TodayCard:
      oneOf:
        - $ref: "#/components/schemas/AgendaCard"
        - $ref: "#/components/schemas/FocusCard"
        - $ref: "#/components/schemas/SystemCard"
      discriminator:
        propertyName: type
        mapping:
          agenda: "#/components/schemas/AgendaCard"
          focus: "#/components/schemas/FocusCard"
          system: "#/components/schemas/SystemCard"
    TodayData:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - date
        - summary
        - cards
      properties:
        workspaceId:
          type: string
        date:
          type: string
          format: date
        summary:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/TodayCard"
    TodayResponse:
      type: object
      additionalProperties: false
      required:
        - meta
        - data
      properties:
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        data:
          $ref: "#/components/schemas/TodayData"
    RecapWindow:
      type: object
      additionalProperties: false
      required:
        - label
        - start
        - end
      properties:
        label:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    RecapHighlight:
      type: object
      additionalProperties: false
      required:
        - title
        - detail
        - category
      properties:
        title:
          type: string
        detail:
          type: string
        category:
          type: string
          enum:
            - capture
            - calendar
            - people
            - system
    RecapStats:
      type: object
      additionalProperties: false
      required:
        - itemsProcessed
        - suggestionsReady
        - remindersDue
      properties:
        itemsProcessed:
          type: integer
          minimum: 0
        suggestionsReady:
          type: integer
          minimum: 0
        remindersDue:
          type: integer
          minimum: 0
    RecapData:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - window
        - narrative
        - highlights
        - stats
      properties:
        workspaceId:
          type: string
        window:
          $ref: "#/components/schemas/RecapWindow"
        narrative:
          type: string
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/RecapHighlight"
        stats:
          $ref: "#/components/schemas/RecapStats"
    RecapResponse:
      type: object
      additionalProperties: false
      required:
        - meta
        - data
      properties:
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        data:
          $ref: "#/components/schemas/RecapData"
    JobProgress:
      type: object
      additionalProperties: false
      required:
        - completedUnits
        - totalUnits
      properties:
        completedUnits:
          type: integer
          minimum: 0
        totalUnits:
          type: integer
          minimum: 1
    JobStatusData:
      type: object
      additionalProperties: false
      required:
        - jobId
        - kind
        - status
        - detail
        - progress
        - updatedAt
      properties:
        jobId:
          type: string
        kind:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - completed
        detail:
          type: string
        progress:
          $ref: "#/components/schemas/JobProgress"
        updatedAt:
          type: string
          format: date-time
    JobStatusResponse:
      type: object
      additionalProperties: false
      required:
        - meta
        - data
      properties:
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        data:
          $ref: "#/components/schemas/JobStatusData"

[package]
name = "ekamcore-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ekamcore_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# S15-001: ContainerRuntime + Keychain + IPC
bollard = "0.17"                                  # Docker Engine API (MIT)
security-framework = "2.11"                        # macOS Keychain (MIT/Apache-2.0)
reqwest = { version = "0.12", features = ["json"] } # HTTP client for health checks (MIT/Apache-2.0)
chrono = { version = "0.4", features = ["serde"] }  # Timestamps (MIT/Apache-2.0)
rand = "0.8"                                        # Crypto-grade random for secret gen (MIT/Apache-2.0)
async-trait = "0.1"                                 # Trait async methods (MIT/Apache-2.0)
thiserror = "1"                                     # Derive Error (MIT/Apache-2.0)
futures-util = "0.3"                                # Stream utilities for bollard (MIT/Apache-2.0)

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

[profile.dev]
incremental = true

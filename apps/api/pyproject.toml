[tool.poetry]
name = "ekamcore-api"
version = "0.1.0"
description = "EkamCore FastAPI backend"
authors = ["EkamCore"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
argon2-cffi = "^23.1.0"
httpx = "^0.28.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
structlog = "^24.0.0"
alembic = "^1.14.0"
qdrant-client = "^1.9.0"
pyyaml = "^6.0.0"
email-validator = "^2.0.0"
greenlet = "^3.3.2"
tiktoken = "^0.12.0"
pillow = "^11.0.0"
pillow-heif = "^0.21.0"
piexif = "^1.1.3"
imagehash = "^4.3.2"
reverse_geocoder = "^1.5.1"

# Phase 3 face pipeline (S11-005). These pulls ~500MB of wheels on first
# install and may take several minutes on ARM macOS. Import is lazy
# inside api.services.face.face_model.load() so the rest of the codebase
# remains importable even without these packages installed.
insightface = "^0.7.3"
onnxruntime = "^1.17.0"
opencv-python-headless = "^4.9.0"

# Sprint 12 clustering (S12-001). HDBSCAN is BSD-3-Clause, scikit-learn
# is BSD-3-Clause. Lazy-imported inside ClusteringService.cluster_workspace
# so the module is importable without them (tests inject a fake module).
hdbscan = "^0.8.33"
scikit-learn = "^1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
psycopg2-binary = "^2.9.11"
requests = "^2.33.0"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "requires_insightface_models: integration tests that require insightface + buffalo_l ONNX models + a face fixture image; skipped unless all three are present",
  "requires_hdbscan: integration tests that require the real hdbscan library (S12-001); skipped unless hdbscan is importable",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

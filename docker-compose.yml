services:
  ekamcore-postgres:
    image: postgres:16.3
    container_name: ekamcore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekamcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekamcore_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ekamcore}
    command: >
      postgres
        -c shared_buffers=192MB
        -c work_mem=4MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
    volumes:
      - ekamcore-pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ekamcore-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekamcore} -d ${POSTGRES_DB:-ekamcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-768M}
          cpus: "1.0"
    restart: unless-stopped

  ekamcore-redis:
    image: redis:7.2-alpine
    container_name: ekamcore-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-ekamcore_redis_dev}
        --databases 4
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
    volumes:
      - ekamcore-redis-data:/data
    networks:
      - ekamcore-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ekamcore_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-192M}
          cpus: "0.25"
    restart: unless-stopped

  ekamcore-qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: ekamcore-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-ekamcore_qdrant_dev}
    volumes:
      - ekamcore-qdrant-data:/qdrant/storage
    networks:
      - ekamcore-net
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEM_LIMIT:-1G}
          cpus: "1.0"
    restart: unless-stopped

  ekamcore-paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: ekamcore-paperless
    environment:
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: ekamcore-postgres
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: ekamcore
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:-ekamcore_dev_password}
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD:-ekamcore_dev_password}@ekamcore-redis:6379/2
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-ekamcore_paperless_dev_secret}
      PAPERLESS_URL: https://localhost
      PAPERLESS_FORCE_SCRIPT_NAME: /paperless
      PAPERLESS_CORS_ALLOWED_HOSTS: https://localhost
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_SKIP_ARCHIVE_FILE: with_text
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_THREADS_PER_WORKER: 1
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      PAPERLESS_FILENAME_FORMAT: "{{ created_year }}/{{ correspondent }}/{{ title }}"
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-ekamcore_dev_password}
    volumes:
      - ekamcore-paperless-data:/usr/src/paperless/data
      - ekamcore-paperless-media:/usr/src/paperless/media
      - ${EKAMCORE_CONSUME_DIR:-./consume}:/usr/src/paperless/consume
    networks:
      - ekamcore-net
    depends_on:
      ekamcore-postgres:
        condition: service_healthy
      ekamcore-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${PAPERLESS_MEM_LIMIT:-1G}
          cpus: "1.0"
    restart: unless-stopped

  ekamcore-migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ekamcore-migrate
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ekamcore:ekamcore_dev_password@ekamcore-postgres:5432/ekamcore}
    networks:
      - ekamcore-net
    depends_on:
      ekamcore-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: "no"

  ekamcore-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ekamcore-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ekamcore:ekamcore_dev_password@ekamcore-postgres:5432/ekamcore}
      REDIS_URL: ${REDIS_URL:-redis://:ekamcore_redis_dev@ekamcore-redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://ekamcore-qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-ekamcore_qdrant_dev}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ekamcore-dev-jwt-secret-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - ekamcore-net
    ports:
      - "8420:8420"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8420/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ekamcore-postgres:
        condition: service_healthy
      ekamcore-redis:
        condition: service_healthy
      ekamcore-qdrant:
        condition: service_healthy
      ekamcore-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-768M}
          cpus: "1.0"
    restart: unless-stopped

  ekamcore-workers:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.workers
    container_name: ekamcore-workers
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ekamcore:ekamcore_dev_password@ekamcore-postgres:5432/ekamcore}
      REDIS_URL: ${REDIS_URL:-redis://:ekamcore_redis_dev@ekamcore-redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://ekamcore-qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-ekamcore_qdrant_dev}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    networks:
      - ekamcore-net
    depends_on:
      ekamcore-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${WORKERS_MEM_LIMIT:-768M}
          cpus: "1.0"
    restart: unless-stopped

  ekamcore-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ekamcore-web
    networks:
      - ekamcore-net
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

  ekamcore-proxy:
    image: caddy:2-alpine
    container_name: ekamcore-proxy
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ekamcore-caddy-data:/data
      - ekamcore-caddy-config:/config
    networks:
      - ekamcore-net
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      ekamcore-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

networks:
  ekamcore-net:
    driver: bridge

volumes:
  ekamcore-pgdata:
  ekamcore-redis-data:
  ekamcore-qdrant-data:
  ekamcore-caddy-data:
  ekamcore-caddy-config:
  ekamcore-paperless-data:
  ekamcore-paperless-media:

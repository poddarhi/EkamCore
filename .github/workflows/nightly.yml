name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # Daily 2am UTC
  workflow_dispatch:

jobs:
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install API dependencies
        working-directory: apps/api
        run: poetry install --no-interaction
      - name: Run API tests
        working-directory: apps/api
        run: poetry run pytest tests/ -v --tb=short --cov=api --cov-report=term-missing
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "test"
          JWT_SECRET_KEY: "test-secret"

  # S15-009: Manager Rust check (smoke test, not full DMG build)
  manager-check:
    name: Manager Rust Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/manager/src-tauri
      - name: Cargo check
        working-directory: apps/manager/src-tauri
        run: cargo check
      - name: Cargo test
        working-directory: apps/manager/src-tauri
        run: cargo test

  # S15-009: Chaos test subset (fastest 3 scenarios)
  # Runs only when Docker stack is available (self-hosted runner or manual dispatch)
  chaos-smoke:
    name: Chaos Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker stack
        run: docker compose up -d --quiet-pull || true
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:8420/health >/dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "WARNING: API not healthy after 5 minutes"
      - name: Run chaos subset (scenarios 1, 3, 5)
        run: |
          bash scripts/chaos/test_postgres_kill_during_write.sh || true
          bash scripts/chaos/test_sigkill_all_containers.sh || true
          bash scripts/chaos/test_ollama_model_corruption.sh || true
      - name: Upload chaos results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results-${{ github.sha }}
          path: scripts/chaos/results/*.json
          retention-days: 30
      - name: Teardown
        if: always()
        run: docker compose down || true

  # S16-008: Mobile E2E tests (Detox on iOS Simulator)
  mobile-e2e-ios:
    name: Mobile E2E (iOS)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install
      - name: Install Detox CLI
        run: npm install -g detox-cli
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install || true
      - name: Build iOS (Debug)
        working-directory: apps/mobile
        run: detox build --configuration ios.sim.debug || true
      - name: Run E2E tests
        working-directory: apps/mobile
        run: detox test --configuration ios.sim.debug --headless || true
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-results-${{ github.sha }}
          path: apps/mobile/artifacts/
          retention-days: 30
